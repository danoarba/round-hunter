<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Receptionist Demo - SmileBright Dental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;500;800;900&display=swap');
        
        body { font-family: 'Montserrat', sans-serif; background-color: #000; color: white; margin: 0; padding: 0; overflow: hidden; }
        
        /* Fullscreen Cinematic Video Player */
        .video-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
        }

        /* Cinematic Letterbox */
        .letterbox-top, .letterbox-bottom {
            position: absolute;
            left: 0; right: 0;
            height: 12%;
            background: #000;
            z-index: 45;
            transition: height 0.5s ease;
        }
        .letterbox-top { top: 0; }
        .letterbox-bottom { bottom: 0; }

        /* Scenes */
        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
            overflow: hidden;
        }
        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Real Video & Dynamic Backgrounds */
        .bg-video {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: 1;
            opacity: 0.5; /* Darkened for text */
            object-fit: cover;
            filter: contrast(1.2) saturate(0.8) brightness(0.6);
        }
        .bg-image {
            position: absolute;
            inset: -10%; /* Oversized for panning */
            background-size: cover;
            background-position: top center;
            background-repeat: no-repeat;
            opacity: 0.3; 
            z-index: 1;
            filter: contrast(1.1) saturate(0.9) brightness(0.7);
        }
        .active .bg-image.zoom-in { animation: kenBurnsZoomIn 10s ease-out forwards; }
        .active .bg-image.pan-right { animation: kenBurnsPanRight 12s ease-out forwards; }

        @keyframes kenBurnsZoomIn {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
        @keyframes kenBurnsPanRight {
            0% { transform: scale(1.15) translateY(0); }
            100% { transform: scale(1.15) translateY(-5%); }
        }

        /* Content Overlay (Above Background) */
        .content-layer {
            position: relative;
            z-index: 10;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Text Styles */
        .cinematic-title {
            font-family: 'Cinzel', serif;
            font-size: 6vw;
            font-weight: 700;
            text-align: center;
            line-height: 1.1;
            text-shadow: 0 10px 40px rgba(0,0,0,1);
            max-width: 90%;
            margin: 0;
            opacity: 0;
            transform: scale(1.1) translateY(20px);
            transition: all 2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .active .cinematic-title {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .text-gold { color: #f59e0b; }
        .text-accent { color: #818cf8; }

        /* Cinematic Subtitles (Closed Captions) */
        .cc-container {
            position: absolute;
            bottom: 14%; /* Above letterbox */
            width: 100%;
            text-align: center;
            z-index: 50;
        }
        .cc-text {
            display: inline-block;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 26px;
            font-weight: 500;
            color: white;
            letter-spacing: 0.5px;
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 80%;
            text-shadow: 0 2px 4px rgba(0,0,0,1);
        }

        /* Glowing Audio visualizer for AI */
        .visualizer {
            position: absolute;
            bottom: 25%;
            display: flex;
            gap: 4px;
            align-items: center;
            height: 60px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .visualizer.show { opacity: 1; }
        .bar {
            width: 6px;
            background: #818cf8;
            border-radius: 6px;
            height: 10px;
            box-shadow: 0 0 15px #818cf8;
            animation: none;
        }
        .speaking .bar { animation: eq 1s ease-in-out infinite; }
        @keyframes eq {
            0%, 100% { height: 10px; }
            50% { height: 50px; }
        }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }

        /* Initial Play Overlay */
        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 1s;
        }
        .play-overlay:hover .play-btn { transform: scale(1.1); background: rgba(255,255,255,0.2); }
        .play-btn {
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Client Name Watermark */
        .watermark {
            position: absolute;
            top: 20px;
            left: 30px;
            z-index: 50;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="video-container" id="videoPlayer">
        
        <div class="watermark">PREPARED FOR: SMILEBRIGHT DENTAL</div>

        <!-- Cinematic Black Bars -->
        <div class="letterbox-top"></div>
        <div class="letterbox-bottom"></div>
        
        <!-- Scene 1: The Pain (Missed Calls) -->
        <div class="scene active" id="scene-pain">
            <!-- REAL Cinematic Video: Dark office / laptop -->
            <video class="bg-video" id="vid-pain" loop muted playsinline>
                <source src="https://assets.mixkit.co/videos/preview/mixkit-business-woman-working-on-a-laptop-in-a-dark-office-42777-large.mp4" type="video/mp4">
            </video>
            <div class="content-layer">
                <h2 class="cinematic-title">Every missed call<br>is a <span class="text-rose-500">lost patient.</span></h2>
            </div>
        </div>

        <!-- Scene 2: The Data -->
        <div class="scene" id="scene-data">
            <!-- REAL Cinematic Video: Corporate / Medical feel -->
            <video class="bg-video" id="vid-data" loop muted playsinline>
                <source src="https://assets.mixkit.co/videos/preview/mixkit-business-people-walking-in-a-modern-office-building-42721-large.mp4" type="video/mp4">
            </video>
            <div class="content-layer">
                <h2 class="cinematic-title">SmileBright Dental loses<br><span class="text-gold">$4,500 a week</span><br>to after-hours calls.</h2>
            </div>
        </div>

        <!-- Scene 3: The Human AI Reveal & Demo -->
        <div class="scene" id="scene-demo">
            <!-- REAL Cinematic Video: Professional Woman with Headset (The AI) -->
            <video class="bg-video !opacity-70" id="vid-demo" loop muted playsinline>
                <source src="https://assets.mixkit.co/videos/preview/mixkit-young-woman-talking-on-a-headset-in-a-call-center-40748-large.mp4" type="video/mp4">
            </video>
            <div class="content-layer">
                <!-- Glowing Visualizer for Voice -->
                <div class="visualizer" id="aiVisualizer">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
            </div>
        </div>

        <!-- Closed Captions (Subtitles) -->
        <div class="cc-container">
            <div class="cc-text" id="ccText"></div>
        </div>

        <!-- Initial Play Overlay -->
        <div class="play-overlay" id="playOverlay" onclick="startFilm()">
            <div class="play-btn">
                <svg class="w-12 h-12 text-white ml-2" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <p class="mt-8 font-bold text-white tracking-[0.3em] uppercase text-sm">Play Presentation</p>
        </div>

        <!-- Final CTA Overlay (Shows at end) -->
        <div class="absolute inset-0 bg-black/90 z-[60] flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-1000" id="ctaOverlay">
            <h2 class="cinematic-title !opacity-100 mb-12">Never miss a patient again.</h2>
            <button class="px-16 py-6 bg-white text-black font-black text-2xl uppercase tracking-widest hover:scale-105 transition-transform" onclick="alert('Redirecting to Checkout!')">
                Deploy Your Agent
            </button>
        </div>

    </div>

    <script>
        function initializePersonalization() {
            const params = new URLSearchParams(window.location.search);
            const clientUrl = params.get('url');
            
            if (clientUrl) {
                const screenshotUrl = `https://image.thum.io/get/width/1920/crop/1080/${clientUrl}`;
                
                // Replace Scene 1 video with client website screenshot
                const scenePain = document.getElementById('scene-pain');
                scenePain.innerHTML = `
                    <div class="bg-image zoom-in" style="background-image: url('${screenshotUrl}'); opacity: 0.3;"></div>
                    <div class="content-layer">
                        <h2 class="cinematic-title">Every missed call<br>is a <span class="text-rose-500">lost patient.</span></h2>
                    </div>
                `;

                // Replace Scene 2 video with client website screenshot (panned)
                const sceneData = document.getElementById('scene-data');
                sceneData.innerHTML = `
                    <div class="bg-image pan-right" style="background-image: url('${screenshotUrl}'); opacity: 0.3;"></div>
                    <div class="content-layer">
                        <h2 class="cinematic-title">Your clinic loses<br><span class="text-gold">$4,500 a week</span><br>to after-hours calls.</h2>
                    </div>
                `;
            }
        }

        window.onload = initializePersonalization;

        // Storyboard Sequence
        const scriptSequence = [
            // Scene 1: Pain
            { type: 'narrator', text: "Did you know that 62 percent of calls to dental clinics go straight to voicemail?", delay: 500, duration: 6000, scene: 'scene-pain' },
            { type: 'narrator', text: "Every single missed call is a lost patient.", delay: 500, duration: 4000 },
            
            // Scene 2: Data
            { type: 'ui', action: 'switch-scene', target: 'scene-data', video: 'vid-data', delay: 4500 },
            { type: 'narrator', text: "In fact, SmileBright Dental loses an estimated $4,500 every week to after-hours missed calls.", delay: 1000, duration: 7000 },
            
            // Scene 3: The Human AI Reveal & Demo
            { type: 'ui', action: 'switch-scene', target: 'scene-demo', video: 'vid-demo', delay: 7500 },
            { type: 'narrator', text: "What if you had an employee who worked 24/7, never slept, and sounded exactly like a human?", delay: 1000, duration: 7000 },
            { type: 'narrator', text: "Meet your new AI Voice Agent. Listen to it in action.", delay: 500, duration: 5500 },
            
            { type: 'ui', action: 'show-visualizer', delay: 5000 },

            { speaker: 'ai', text: "Thank you for calling SmileBright Dental, this is your AI assistant speaking. Are you an existing patient or a new patient?", delay: 500, duration: 4500 },
            { speaker: 'patient', text: "Uh, hey. I'm a new patient.", delay: 4500, duration: 1500 },
            { speaker: 'ai', text: "Welcome to SmileBright! I can help you schedule your first appointment. Are you looking to book a routine cleaning, or are you experiencing any dental pain today?", delay: 1800, duration: 5500 },
            { speaker: 'patient', text: "Just a routine cleaning.", delay: 5800, duration: 1500 },
            { speaker: 'ai', text: "Great. I have an opening this Thursday at 2:00 PM, or Friday at 10:00 AM. Do either of those work for you?", delay: 1500, duration: 4000 },
            { speaker: 'patient', text: "Friday at 10 works perfectly.", delay: 4200, duration: 2000 },
            { speaker: 'ai', text: "Perfect. I've penciled you in for Friday at 10:00 AM. We will send a reminder text to your number.", delay: 2000, duration: 4500 },
            
            // Outro
            { type: 'ui', action: 'show-cta', delay: 5500 },
            { type: 'narrator', text: "Claim your AI agent today.", delay: 1000, duration: 5000 },
        ];

        let isPlaying = false;
        let aiVoice = null, patientVoice = null, narratorVoice = null;
        
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            narratorVoice = voices.find(v => v.name.includes('Male') || v.name.includes('Daniel') || v.name.includes('Google US English')) || voices[0];
            aiVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Google UK English Female')) || voices[0];
            patientVoice = voices.find(v => v.name.includes('Alex') || v.name.includes('Google UK English Male')) || voices[voices.length - 1];
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;

        function speak(text, speakerType) {
            if (!window.speechSynthesis) return;
            const utterance = new SpeechSynthesisUtterance(text);
            
            if (speakerType === 'ai') {
                utterance.voice = aiVoice; utterance.pitch = 1.0; utterance.rate = 1.05; 
            } else if (speakerType === 'patient') {
                utterance.voice = patientVoice; utterance.pitch = 0.95; utterance.rate = 1.0; 
            } else { 
                utterance.voice = narratorVoice; utterance.pitch = 0.8; utterance.rate = 0.95; 
            }
            window.speechSynthesis.speak(utterance);
        }

        function startFilm() {
            if (isPlaying) return;
            isPlaying = true;
            
            if (!narratorVoice) loadVoices();
            window.speechSynthesis.cancel();
            
            // Start first video
            document.getElementById('vid-pain').play();

            // Hide overlay
            document.getElementById('playOverlay').style.opacity = '0';
            setTimeout(() => document.getElementById('playOverlay').style.display = 'none', 1000);

            const ccEl = document.getElementById('ccText');
            const visualizer = document.getElementById('aiVisualizer');

            let currentDelay = 0;

            scriptSequence.forEach((step) => {
                currentDelay += step.delay;
                
                setTimeout(() => {
                    
                    if (step.type === 'ui') {
                        if (step.action === 'switch-scene') {
                            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
                            document.getElementById(step.target).classList.add('active');
                            ccEl.style.opacity = '0';
                            if(step.video) document.getElementById(step.video).play();
                        } else if (step.action === 'show-visualizer') {
                            visualizer.classList.add('show');
                        } else if (step.action === 'show-cta') {
                            const cta = document.getElementById('ctaOverlay');
                            cta.style.opacity = '1';
                            cta.style.pointerEvents = 'auto';
                        }
                    } else if (step.type === 'narrator' || step.speaker) {
                        
                        // Closed Captions
                        ccEl.style.opacity = '0';
                        setTimeout(() => {
                            ccEl.innerText = step.text;
                            ccEl.style.opacity = '1';
                            if(step.speaker === 'ai') ccEl.style.color = '#c7d2fe';
                            else if(step.speaker === 'patient') ccEl.style.color = '#94a3b8';
                            else ccEl.style.color = 'white';
                        }, 300);

                        speak(step.text, step.speaker || 'narrator');

                        // Live Call Visualizer Sync
                        if (step.speaker === 'ai') {
                            visualizer.classList.add('speaking');
                            setTimeout(() => visualizer.classList.remove('speaking'), step.duration);
                        }
                    }

                }, currentDelay);
            });

            setTimeout(() => {
                isPlaying = false;
                ccEl.style.opacity = '0';
            }, currentDelay + 5000);
        }
    </script>
</body>
</html>
