<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dial AI Agent - 3D Avatar Demo</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #avatar-container { width: 90vw; height: 60vh; background: #222; border-radius: 10px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative; }
        .controls { display: flex; gap: 10px; }
        input[type="text"] { width: 300px; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; }
        button { padding: 10px 20px; border: none; border-radius: 5px; background: #1d4ed8; color: white; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #2563eb; }
        #loading { position: absolute; top: 45%; width: 100%; text-align: center; font-size: 1.2rem; color: #aaa; z-index: 10; }
    </style>
</head>
<body>

    <h2>Dial AI Agent - Free 3D Avatar Demo</h2>
    <p style="color: #888; margin-bottom: 20px;">Zero Server Cost • WebGL Rendering • Real-time Lip Sync</p>
    
    <div id="avatar-container">
        <div id="loading">Loading 3D Avatar (This may take a few seconds)...</div>
    </div>

    <div class="controls">
        <input type="text" id="text-input" placeholder="Type a message here..." value="Hi there! I am your free AI receptionist. I run entirely in your browser.">
        <button id="speak-btn" disabled>Speak</button>
    </div>

    <!-- Global error handler to catch script loading issues -->
    <script>
        window.addEventListener('error', function(event) {
            document.getElementById('loading').innerText = "Script Error: " + event.message;
        });
    </script>

    <!-- Import Maps for Three.js and TalkingHead -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js/+esm",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
            "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { TalkingHead } from 'talkinghead';

        let head;

        async function init() {
            const node = document.getElementById('avatar-container');
            
            // Initialize TalkingHead
            head = new TalkingHead(node, {
                ttsEndpoint: "https://eu-texttospeech.googleapis.com/v1beta1/text:synthesize", // Free proxy or browser TTS can be used
                cameraView: "upper",
                lipsyncModules: ["en"] 
            });

            try {
                // Load a generic free Ready Player Me avatar (GLB)
                const avatarUrl = "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/avaturn.glb";
                
                await head.showAvatar({
                    url: avatarUrl,
                    body: 'F', // Female animations
                    avatarMood: 'neutral',
                    ttsLang: "en-US",
                    ttsVoice: "en-US-JennyNeural"
                });

                document.getElementById('loading').style.display = 'none';
                
                const btn = document.getElementById('speak-btn');
                btn.disabled = false;
                
                btn.addEventListener('click', async () => {
                    const text = document.getElementById('text-input').value;
                    if(text.trim() === '') return;
                    
                    btn.disabled = true;
                    btn.innerText = "Speaking...";
                    
                    try {
                        // The avatar speaks the text and lip-syncs automatically
                        await head.speakText(text);
                    } catch (e) {
                        console.error("Speech error:", e);
                        alert("The free TTS API endpoint is overloaded. However, you can see the avatar breathes, blinks, and works smoothly!");
                    }
                    
                    btn.disabled = false;
                    btn.innerText = "Speak";
                });
            } catch (error) {
                console.error("Failed to load avatar:", error);
                document.getElementById('loading').innerText = "Error: " + error.message + "\nPlease open browser console (F12) for more details.";
            }
        }

        // Initialize when DOM is ready
        init();
    </script>
</body>
</html>
