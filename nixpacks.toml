[providers]
node = true
python = true

[phases.setup]
nixPkgs = ["...", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "npm install",
  "npm run build",
  "cd server && npm install",
  "python3 -m venv server/venv",
  "server/venv/bin/pip install requests beautifulsoup4 python-dotenv duckduckgo-search premailer html2text"
]

[start]
cmd = "cd server && node index.js"
